spring.cloud.config.enabled=false

# ==== Integración servicio externo de productos ====
producto.service.url=${PRODUCTO_SERVICE_URL:https://services.preprodcxr.co/puntored/api/v1}
producto.service.token=${PRODUCTO_SERVICE_TOKEN:}
producto.service.connect-timeout-ms=${PRODUCTO_SERVICE_CONNECT_TIMEOUT_MS:5000}
producto.service.read-timeout-ms=${PRODUCTO_SERVICE_READ_TIMEOUT_MS:10000}

# ==== GestoPago ====
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}

# ==== Base de datos (en Render vienen de variables de entorno) ====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/base_catalogo}
spring.datasource.username=${DB_USERNAME:grimm}
spring.datasource.password=${DB_PASSWORD:}

# ==== Redis (caché de productos) ====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# ==== JWT ====
app.jwt.secret=${JWT_SECRET:c2VjcmV0b3N1cGVyc2VndXJvcGFyYWVscHJveWVjdG9kZWNsaWVudGVzMTIzNA==}
app.jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}

# ==== Saldo inicial de cuentas nuevas ====
cuenta.saldo-inicial=0

# ==== Sesión ====
sesion.inactividad-minutos=${SESION_INACTIVIDAD_MINUTOS:5}
sesion.limpieza-ms=${SESION_LIMPIEZA_MS:60000}